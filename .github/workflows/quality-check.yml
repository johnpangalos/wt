name: quality-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Lint install.sh
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck install.sh
          sh -n install.sh

      - name: Cross-compile darwin-arm64
        run: bun build src/cli.ts --compile --minify --target=bun-darwin-arm64 --outfile dist/wt-darwin-arm64

      - name: Validate binary format
        run: file dist/wt-darwin-arm64 | grep -q 'Mach-O'

      - name: install.sh refuses non-macOS platforms
        run: |
          # wt drives Ghostty via AppleScript, so it is macOS-only. On this Linux
          # runner install.sh must bail out at the platform gate (non-zero exit)
          # with a clear message rather than installing an unusable binary.
          if WT_VERSION=test PREFIX=/tmp/wt-install sh install.sh; then
            echo "expected install.sh to refuse this Linux runner" >&2
            exit 1
          fi
          WT_VERSION=test PREFIX=/tmp/wt-install sh install.sh 2>&1 \
            | grep -q 'macOS' || { echo "missing macOS-only message" >&2; exit 1; }

  e2e-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Build darwin-arm64
        run: bun run build:darwin-arm64

      - name: install.sh end-to-end (local mock release)
        run: |
          # macOS runner is Apple Silicon, so the darwin-arm64 binary runs
          # natively - exercise the real install.sh happy path end to end.
          # (macOS has shasum, not sha256sum; install.sh verifies with either.)
          mkdir -p /tmp/fake-release
          cp dist/wt-darwin-arm64 /tmp/fake-release/
          ( cd /tmp/fake-release && shasum -a 256 wt-darwin-arm64 > SHA256SUMS )
          ( cd /tmp/fake-release && python3 -m http.server 8787 ) &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for _ in 1 2 3 4 5; do curl -fsS http://localhost:8787/SHA256SUMS && break; sleep 1; done

          sed 's|^base=.*|base="http://localhost:8787"|' install.sh > /tmp/install-patched.sh
          WT_VERSION=test PREFIX=/tmp/wt-install sh /tmp/install-patched.sh
          /tmp/wt-install/bin/wt --help

      - name: update prompt works on a real terminal
        run: |
          # The confirm prompt reads /dev/tty, so only a pty exercises it --
          # and a pty is the one thing `bun test` cannot give it. This guards
          # the regression where wrapping those fds in tty.ReadStream/
          # tty.WriteStream made `new WriteStream(fd)` throw EINVAL (kqueue)
          # under Bun on macOS; the throw was swallowed and every user with a
          # perfectly good terminal got a silent "aborted." instead of a
          # question.
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/gh <<'GH'
          #!/bin/sh
          case "$*" in
            *releases/latest*) printf 'wt-v99.0.0\n'; exit 0 ;;
          esac
          exit 0
          GH
          # `wt update` installs via `curl ... | sh`; a fake curl that emits a
          # shell script keeps the whole path hermetic and off the network.
          cat > /tmp/fakebin/curl <<'CURL'
          #!/bin/sh
          echo 'echo INSTALLED'
          CURL
          chmod +x /tmp/fakebin/gh /tmp/fakebin/curl
          export PATH="/tmp/fakebin:$PATH"
          export XDG_STATE_HOME=/tmp/wt-update-state
          export WT_NO_UPDATE_CHECK=1

          # Answer "n" so nothing is installed -- the assertion that matters is
          # that the question reached the terminal at all.
          out=$(printf 'n\n' | script -q /dev/null ./dist/wt-darwin-arm64 update || true)
          printf '%s\n' "$out"

          case "$out" in
            *"install? [y/N]"*) ;;
            *) echo "FAIL: prompt never reached the terminal" >&2; exit 1 ;;
          esac
          case "$out" in
            *aborted*) ;;
            *) echo "FAIL: answering n did not abort" >&2; exit 1 ;;
          esac
          case "$out" in
            *"no terminal"*) echo "FAIL: claimed no terminal on a real pty" >&2; exit 1 ;;
          esac

          # --yes must not ask, and must not need a terminal to proceed.
          out=$(./dist/wt-darwin-arm64 update --yes < /dev/null 2>&1 || true)
          printf '%s\n' "$out"
          case "$out" in
            *"install? [y/N]"*) echo "FAIL: --yes still prompted" >&2; exit 1 ;;
          esac
          case "$out" in
            *"no terminal"*) echo "FAIL: --yes demanded a terminal" >&2; exit 1 ;;
          esac
          case "$out" in
            *INSTALLED*) ;;
            *) echo "FAIL: --yes did not reach the installer" >&2; exit 1 ;;
          esac

  release-please-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: release-please dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          npx --yes release-please@latest release-pr \
            --token="$GITHUB_TOKEN" \
            --repo-url=johnpangalos/wt \
            --config-file=release-please-config.json \
            --manifest-file=.release-please-manifest.json \
            --target-branch="$BRANCH" \
            --dry-run --debug
